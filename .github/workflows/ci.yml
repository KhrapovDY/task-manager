name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform=linux/amd64 \
            -t KhrapovDY/task-manager:ci-${GITHUB_SHA:0:8} \
            --load .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          python -m pytest

      - name: Run app in container
        run: |
          docker run --rm -d \
            -p 8080:8080 \
            --name task-manager-test \
            KhrapovDY/task-manager:ci-${GITHUB_SHA:0:8}

          sleep 10

          docker inspect task-manager-test